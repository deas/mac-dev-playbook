---
# Hermes as user-scoped LaunchAgents, replacing the Docker container that used to
# run it inside the Colima VM: the gateway (F-02) and the web dashboard (F-03).
# They are two processes, not two modes -- `gateway run` never serves the dashboard;
# in the container image they were separate s6 services.
#
# The gateway is deliberately NOT registered under hermes' own `ai.hermes.gateway`
# label: hermes rewrites and boots out that label itself (upstream #43842, #69098),
# and `hermes gateway install` resets HERMES_HOME back to ~/.hermes (#32741), which
# on this host is a different state tree. It does carry the `ai.hermes.gateway*`
# prefix -- see hermes_launchd_label for why that is what keeps the desktop app's
# orphan reaper off it. launchd runs `gateway run` in the foreground so it is the
# supervisor -- never `hermes gateway start`, which degrades to an unsupervised
# detached process on launchctl exit 5 (#11323, #42524).

- name: Configure the Hermes host services
  become: true
  become_user: "{{ hermes_target_user }}"
  environment:
    HOME: "{{ hermes_target_user_home }}"
  block:
    - name: Resolve the uid of {{ hermes_target_user }}
      ansible.builtin.command: id -u {{ hermes_target_user }}
      register: hermes_uid
      changed_when: false
      check_mode: false

    - name: Install Hermes if it is not present
      ansible.builtin.shell:
        cmd: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
        creates: "{{ hermes_bin }}"

    # 0700, not 0755: hermes already keeps this at 0700 and agent logs carry
    # conversation content.
    - name: Ensure the Hermes log directory exists
      ansible.builtin.file:
        path: "{{ hermes_log_dir }}"
        state: directory
        mode: "0700"

    # Before the converge below, not after: a retired agent still holds 8642, so a
    # renamed gateway could not bind while its predecessor is loaded.
    - name: Bootout retired gateway LaunchAgents if they are loaded
      ansible.builtin.command: >-
        launchctl bootout gui/{{ hermes_uid.stdout }}/{{ item }}
      register: hermes_retired_bootout
      failed_when: false
      changed_when: hermes_retired_bootout.rc == 0
      loop: "{{ hermes_retired_launchd_labels }}"

    - name: Remove retired gateway LaunchAgent plists if present
      ansible.builtin.file:
        path: "{{ hermes_target_user_home }}/Library/LaunchAgents/{{ item }}.plist"
        state: absent
      loop: "{{ hermes_retired_launchd_labels }}"

    - name: Ensure the LaunchAgents directory exists
      ansible.builtin.file:
        path: "{{ hermes_target_user_home }}/Library/LaunchAgents"
        state: directory
        mode: "0755"

    - name: Converge the Hermes LaunchAgents
      ansible.builtin.include_tasks: hermes-launchagent.yml
      loop: "{{ hermes_launchagents }}"
      loop_control:
        loop_var: hermes_agent
        label: "{{ hermes_agent.label }}"
      vars:
        hermes_launchagents: >-
          {{
            [
              {
                'label': hermes_launchd_label,
                'template': 'hermes-gateway.plist.j2'
              }
            ]
            + (
              [
                {
                  'label': hermes_dashboard_launchd_label,
                  'template': 'hermes-dashboard.plist.j2'
                }
              ] if hermes_dashboard_enabled else []
            )
          }}
