  - wrk
  - zsh-history-substring-search

homebrew_uninstalled_packages:
  - doxygen
  - gifsicle

homebrew_cask_uninstalled_apps:
  - docker
  - claude-code

# Colima (Docker daemon VM) configuration.
colima_target_user: apfelmus
colima_target_user_home: "/Users/{{ colima_target_user }}"
colima_memory_gib: 4
# vz + virtiofs gives near-native bind-mount perf on Apple Silicon (macOS 13+).
colima_vm_type: vz
colima_mount_type: virtiofs
colima_extra_mounts:
  - location: "{{ colima_target_user_home }}"
    writable: true
# Self-healing supervisor invoked by the LaunchDaemon (see bin/colima-supervisor).
colima_supervisor_path: "{{ colima_target_user_home }}/.colima/colima-supervisor"

# Hermes agent (host service) configuration.
hermes_enabled: true
hermes_target_user: apfelmus
hermes_target_user_home: "/Users/{{ hermes_target_user }}"
# Kept from the container deployment so no state migration is needed. The directory
# was renamed hermes-docker-daten -> hermes-daten on the host on 2026-08-26 (the old
# tree is archived as hermes-docker-daten-260617.tar.gz); this var follows it.
hermes_home: "{{ hermes_target_user_home }}/hermes-daten"
hermes_bin: "{{ hermes_target_user_home }}/.local/bin/hermes"
# Carries hermes' own ai.hermes.gateway* prefix, with a suffix no hermes profile can
# produce -- the dot is outside hermes' profile-name regex. The orphan reaper in the
# desktop app's backend protects every launchd label with that prefix (a `launchctl
# list` scan in _get_service_pids), while hermes' own restart/update/install paths act
# only on labels derived from installed profiles (launchd_gateway_labels_for_install),
# which can never yield this one. Protected, but not hermes-managed.
# Until 2026-09-01 this was de.contentreich.hermes-gateway; the reaper then read it as
# an unsupervised orphan and SIGTERM'd it every 15-40 min (see hermes-app-problem.md).
hermes_launchd_label: ai.hermes.gateway-de.contentreich
# Gateway agents provisioning retires on sight (F-02 R5): hermes' own, and the label
# this host used before the rename above.
hermes_retired_launchd_labels:
  - ai.hermes.gateway
  - de.contentreich.hermes-gateway
hermes_log_dir: "{{ hermes_home }}/logs"
# Non-secret runtime config, carried over from the container's app.env. Secrets stay
# in {{ hermes_home }}/.env, which hermes reads and rewrites itself.
# API_SERVER_HOST only defaulted to 0.0.0.0 inside the container; natively it
# defaults to loopback, so it is set explicitly here.
# The dashboard runs as its own LaunchAgent (see hermes_dashboard_* below), not from
# these keys: `gateway run` never starts it, and the container's HERMES_DASHBOARD*
# env keys drove an s6 service that has no native equivalent.
hermes_environment:
  HERMES_HOME: "{{ hermes_home }}"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HERMES_MAX_ITERATIONS: "90"
  BROWSER_INACTIVITY_TIMEOUT: "120"
  BROWSER_SESSION_TIMEOUT: "300"
  BROWSERBASE_ADVANCED_STEALTH: "false"
  BROWSERBASE_PROXIES: "true"
  EMAIL_POLL_INTERVAL: "15"
  EMAIL_SMTP_HOST: "smtp.gmail.com"
  EMAIL_SMTP_PORT: "587"
  TERMINAL_LIFETIME_SECONDS: "300"
  TERMINAL_TIMEOUT: "60"

# Hermes dashboard (F-03). A second process, not a mode of the gateway; the Hermes
# desktop app expects the machine dashboard on 9119.
hermes_dashboard_enabled: true
hermes_dashboard_launchd_label: de.contentreich.hermes-dashboard
# Loopback only. Since the June 2026 hardening a non-loopback bind ALWAYS requires a
# registered auth provider -- `--insecure` no longer waives it -- and the dashboard's
# interactive auth setup is TTY-only, so under launchd a public bind is a SystemExit
# on every launch, not a prompt. The desktop app runs on this host, so loopback
# reaches it. Exposing this remotely means registering an auth provider first.
hermes_dashboard_host: "127.0.0.1"
hermes_dashboard_port: "9119"

homebrew_taps: []

homebrew_cask_appdir: /Applications
homebrew_cask_apps: # []
  # - tailscale
  - ghostty
  - lm-studio
  - gcloud-cli
  - obsidian
  # - chromedriver
  # - docker  # Replaced by colima + docker CLI formulae.
